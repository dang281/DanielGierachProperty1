<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- GieMann seal, D&C variant: same full-bleed circle as favicon.svg
       (cream disc + gold ring) so the two marks read as siblings in a tab
       row. Circle fills the viewBox so Google's circular favicon slot
       does not clip it. Monogram stays italic serif per the D&C mark. -->
  <circle cx="16" cy="16" r="16" fill="#e6d9bd"/>
  <circle cx="16" cy="16" r="14.4" fill="none" stroke="#b98229" stroke-width="1.5"/>
  <text x="16" y="20.6"
    font-family="'Fraunces','Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif"
    font-size="11.5"
    font-style="italic"
    font-weight="700"
    fill="#b98229"
    text-anchor="middle"
    letter-spacing="-0.02em">D&amp;C</text>
</svg>
